<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Unity WebGL Player | Alien Invasion Resurrected</title>
    </head>
    <body style="text-align: center">
        <canvas id="unity-canvas" width="960" height="600" style="width: 960px; height: 600px; background: rgb(35, 31, 32); cursor: default;"></canvas>
        <script src="./Build/AlienInvasionResurrected.loader.js"></script>
        <script>
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              // Mobile device style: fill the whole browser client area with the game canvas:
              var meta = document.createElement('meta');
              meta.name = 'viewport';
              meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
              document.getElementsByTagName('head')[0].appendChild(meta);
            }
            
            createUnityInstance(document.querySelector("#unity-canvas"), {
              dataUrl: "Build/AlienInvasionResurrected.data",
              frameworkUrl: "Build/AlienInvasionResurrected.framework.js",
              codeUrl: "Build/AlienInvasionResurrected.wasm",
              companyName: "DG Software",
              productName: "Alien Invasion Resurrected",
              productVersion: "1.1",
              // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
              // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            });
        </script>
    </body>
</html>
