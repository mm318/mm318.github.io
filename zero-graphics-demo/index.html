<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZeroGraphics Demo</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #444; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #error { position: absolute; inset: 1em; color: #fff; white-space: pre-wrap; }
    </style>
</head>
<body>
    <canvas id="render-canvas" tabindex="0"></canvas>
    <pre id="error" hidden></pre>
    <script type="module">
        import createZeroGraphics from './demo_application.js';
        import {startApplication} from './zero-graphics.js';
        const canvas = document.getElementById('render-canvas');
        createZeroGraphics({canvas}).then(module => {
            window.zeroGraphics = startApplication(module, canvas);
            canvas.focus();
        }).catch(error => {
            console.error(error);
            const message = document.getElementById('error');
            message.hidden = false;
            message.textContent = String(error);
        });
    </script>
</body>
</html>
